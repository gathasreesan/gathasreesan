<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0420"/><stop offset=".55" stop-color="#2a0b52"/><stop offset="1" stop-color="#5b0f6e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36e"/><stop offset=".5" stop-color="#ff5fa2"/><stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0a5e"/><stop offset="1" stop-color="#12021f"/>
    </linearGradient>
    <radialGradient id="planet" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#9ff3ff"/><stop offset=".6" stop-color="#5b8cff"/><stop offset="1" stop-color="#3b1a8a"/>
    </radialGradient>
    <radialGradient id="planet2" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#ff9ff0"/><stop offset=".6" stop-color="#d43bff"/><stop offset="1" stop-color="#4a0f7a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="sunclip"><circle cx="600" cy="250" r="110"/></clipPath>
    <style>
      .tw{animation:tw 2.4s ease-in-out infinite}.tw2{animation:tw 3.1s ease-in-out infinite .8s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .fl{animation:fl 5s ease-in-out infinite}.fl2{animation:fl 6s ease-in-out infinite 1s}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .grid{animation:mv 1.6s linear infinite}
      @keyframes mv{from{transform:translateY(0)}to{transform:translateY(22px)}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="tw" cx="90" cy="50" r="1.6"/><circle class="tw2" cx="210" cy="120" r="1.2"/><circle class="tw" cx="330" cy="40" r="1.4"/>
    <circle class="tw2" cx="470" cy="90" r="1"/><circle class="tw" cx="760" cy="60" r="1.5"/><circle class="tw2" cx="880" cy="130" r="1.1"/>
    <circle class="tw" cx="1010" cy="45" r="1.3"/><circle class="tw2" cx="1130" cy="110" r="1.6"/><circle class="tw" cx="560" cy="30" r="1"/>
    <path class="tw" d="M300 150 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" fill="#fff"/>
    <path class="tw2" d="M940 200 l2 7 7 2 -7 2 -2 7 -2 -7 -7 -2 7 -2z" fill="#fff"/>
  </g>

  <!-- sun -->
  <g clip-path="url(#sunclip)">
    <circle cx="600" cy="250" r="110" fill="url(#sun)"/>
    <g fill="#2a0b52"><rect x="480" y="262" width="240" height="5"/><rect x="480" y="280" width="240" height="8"/><rect x="480" y="300" width="240" height="11"/><rect x="480" y="323" width="240" height="14"/></g>
  </g>
  <circle cx="600" cy="250" r="118" fill="none" stroke="#ff5fa2" stroke-opacity=".35" filter="url(#soft)"/>

  <!-- floor grid -->
  <rect y="300" width="1200" height="120" fill="url(#floor)"/>
  <g stroke="#ff3fd8" stroke-opacity=".75" stroke-width="1.4" filter="url(#glow)">
    <line x1="0" y1="300" x2="1200" y2="300" stroke-width="2.5"/>
    <g class="grid">
      <line x1="0" y1="304" x2="1200" y2="304"/><line x1="0" y1="314" x2="1200" y2="314"/><line x1="0" y1="328" x2="1200" y2="328"/>
      <line x1="0" y1="348" x2="1200" y2="348"/><line x1="0" y1="374" x2="1200" y2="374"/><line x1="0" y1="406" x2="1200" y2="406"/>
    </g>
    <line x1="600" y1="300" x2="600" y2="420"/>
    <line x1="560" y1="300" x2="440" y2="420"/><line x1="640" y1="300" x2="760" y2="420"/>
    <line x1="520" y1="300" x2="280" y2="420"/><line x1="680" y1="300" x2="920" y2="420"/>
    <line x1="480" y1="300" x2="120" y2="420"/><line x1="720" y1="300" x2="1080" y2="420"/>
    <line x1="440" y1="300" x2="-40" y2="420"/><line x1="760" y1="300" x2="1240" y2="420"/>
    <line x1="380" y1="300" x2="-260" y2="420"/><line x1="820" y1="300" x2="1460" y2="420"/>
  </g>

  <!-- planets & squiggles -->
  <g class="fl"><circle cx="150" cy="250" r="52" fill="url(#planet)"/><ellipse cx="150" cy="250" rx="82" ry="14" fill="none" stroke="#9ff3ff" stroke-opacity=".7" stroke-width="2" transform="rotate(-18 150 250)"/></g>
  <g class="fl2"><circle cx="1070" cy="90" r="30" fill="url(#planet2)"/></g>
  <path class="fl2" d="M250 60 q12 -16 24 0 t24 0 t24 0" fill="none" stroke="#b98bff" stroke-width="4" stroke-linecap="round"/>
  <path class="fl" d="M960 250 q12 -16 24 0 t24 0 t24 0" fill="none" stroke="#5ef2ff" stroke-width="4" stroke-linecap="round"/>
  <path class="fl" d="M1110 300 l18 0 -9 -16z" fill="none" stroke="#ff5fa2" stroke-width="3" stroke-linejoin="round"/>

  <!-- title -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="600" y="128" font-family="'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-weight="800" font-size="78" letter-spacing="6" fill="#ffffff">GATHA SREESAN</text>
    <text x="600" y="178" font-family="'Segoe Script', 'Brush Script MT', 'Lucida Handwriting', cursive" font-size="30" fill="#ff7ad9">Engineer in progress · Dancer in motion</text>
  </g>
  <text x="600" y="222" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" letter-spacing="5" fill="#e6dcff">AI  |  HUMAN–COMPUTER INTERACTION  |  COMPUTER GRAPHICS</text>
</svg>
