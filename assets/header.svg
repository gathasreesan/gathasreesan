<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/><stop offset=".55" stop-color="#17121f"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8864f"/><stop offset=".5" stop-color="#f3dfb0"/><stop offset="1" stop-color="#a8864f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#C9A96E" stop-opacity=".18"/><stop offset="1" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <style>
      .f{opacity:0;animation:in 1.6s ease forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.1s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <ellipse cx="600" cy="125" rx="520" ry="150" fill="url(#glow)"/>
  <rect x="14" y="14" width="1172" height="252" rx="12" fill="none" stroke="#C9A96E" stroke-opacity=".35"/>
  <g class="f d1" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="600" y="72" font-size="15" letter-spacing="9" fill="#C9A96E" fill-opacity=".8">— PORTFOLIO —</text>
    <text x="600" y="150" font-size="76" letter-spacing="12" fill="url(#gold)">GATHA SREESAN</text>
  </g>
  <g class="f d2">
    <line x1="420" y1="180" x2="575" y2="180" stroke="url(#gold)"/>
    <path d="M600 172 l8 8 -8 8 -8 -8z" fill="#C9A96E"/>
    <line x1="625" y1="180" x2="780" y2="180" stroke="url(#gold)"/>
  </g>
  <text class="f d3" x="600" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="6" fill="#e8dcc4">ENGINEER  ·  TECH COMMUNICATOR  ·  DANCER</text>
</svg>
